apiVersion: v1
kind: Namespace
metadata:
  name: test-mesh
  labels:
    istio.io/dataplane-mode: ambient
    istio.io/use-waypoint: waypoint
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caller-app
  namespace: test-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caller
  template:
    metadata:
      labels:
        app: caller
    spec:
      nodeSelector:
        karpenter.sh/nodepool: "low-cost-pool"
      containers:
      - name: curl
        image: curlimages/curl
        # Bucle infinito haciendo peticiones cada 1 segundo
        command: ["/bin/sh", "-c", "while true; do curl -i -s --max-time 3 http://backend.test-mesh.svc.cluster.local:8080/headers; sleep 2; done"]
        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  namespace: test-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        karpenter.sh/nodepool: "low-cost-pool"
      containers:
      - name: httpbin
        image: mccutchen/go-httpbin
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: test-mesh
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: backend