# Inyectado automáticamente por Argo CD en el despliegue del microservicio
apiVersion: v1
kind: Namespace
metadata:
  name: test-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "-5" # 🎯 Se ejecuta antes que cualquier otra cosa
  labels:
    istio.io/dataplane-mode: ambient
    istio.io/use-waypoint: waypoint
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: test-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "-4" # 🎯 Se levanta justo después del namespace
  labels:
    gateway.networking.k8s.io/gateway-name: waypoint
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
# 2. CONFIGURACIÓN DEL FRONTEND (NGINX actuando como Servidor de App)
# Configura a NGINX para que cuando reciba tráfico en "/", llame internamente al Backend.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: test-mesh
data:
  nginx.conf: |
    events {}
    http {
        server {
            listen 80;
    
            location / {
                # 🎯 Redirige la petición internamente al DNS del Servicio B
                proxy_pass http://servicio-b-backend.test-mesh.svc.cluster.local;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
        }
    }

---
# 3. SERVICIO A (FRONTEND SERVER)
apiVersion: v1
kind: Service
metadata:
  name: servicio-a-frontend
  namespace: test-mesh
spec:
  ports:
    - name: http-frontend # 👈 Prefijo para que Istio y Kiali midan métricas HTTP
      port: 80
      targetPort: 80
  selector:
    app: frontend-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicio-a-frontend
  namespace: test-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      nodeSelector:
        karpenter.sh/nodepool: "low-cost-pool"

      containers:
        - name: frontend-server
          image: nginx:alpine
          resources:
            requests:
              cpu: "100m"     # HPA looks at this to calculate the 70% or 80% threshold
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config-volume
          configMap:
            name: frontend-nginx-config
---
# 4. SERVICIO B (BACKEND SERVER con retraso simulado)
apiVersion: v1
kind: Service
metadata:
  name: servicio-b-backend
  namespace: test-mesh
spec:
  ports:
    - name: http-backend # 👈 Prefijo obligatorio
      port: 80
      targetPort: 80
  selector:
    app: backend-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicio-b-backend
  namespace: test-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      nodeSelector:
        karpenter.sh/nodepool: "low-cost-pool"

      containers:
        - name: backend
          image: ealen/echo-server:latest
          resources:
            requests:
              cpu: "100m"     # HPA looks at this to calculate the 70% or 80% threshold
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: "80"

---
# 5. INGRESS PÚBLICO (Tu Ingress-NGINX de la frontera)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: test-mesh
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/service-upstream: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: istio-test.aws.rj-engineering.com # URL para tus pruebas
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: servicio-a-frontend
                port:
                  number: 80
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: proteccion-servicio-b
  namespace: test-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "-3" # Se despliega justo después del Gateway y servicios
spec:
  host: servicio-b-backend.test-mesh.svc.cluster.local # 👈 El servicio destino al que aplicamos la política
  
  # 1. Política de balanceo de carga entre las réplicas del Servicio B
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST # Envoy enviará las nuevas peticiones al pod que menos conexiones activas tenga en ese momento
      
    # 2. Control de concurrencia y Circuit Breaking (Pool de Conexiones)
    connectionPool:
      tcp:
        maxConnections: 100 # Límite máximo de conexiones TCP simultáneas permitidas hacia el backend
      http:
        http1MaxPendingRequests: 50 # Peticiones máximas que se quedan en cola esperando un hilo libre
        maxRequestsPerConnection: 10 # Número máximo de peticiones reutilizables por cada conexión persistente
        
    # 3. Detección de anomalías y expulsión automática (Outlier Detection / Circuit Breaking dinámico)
    outlierDetection:
      consecutive5xxErrors: 3    # Si un pod del Servicio B devuelve 3 errores 5xx consecutivos...
      interval: 10s              # ...evaluando ventanas de 10 segundos...
      baseEjectionTime: 30s      # ...lo aísla/expulsa del pool de balanceo durante 30 segundos.
      maxEjectionPercent: 50     # Máximo porcentaje de réplicas que pueden ser expulsadas a la vez (para no tumbar el 100% del servicio)